name: ci

on:
  push:
    branches: [master, claude/review]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The library is two trees, one per shadcn base: bases/radix (the default
  # scripts) and bases/base (the `:base` scripts, ST_BASE=base).
  library:
    name: 'library (${{ matrix.base }}: tsc, lint, storybook build)'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: [radix, base]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shadcn-table tsc
        if: matrix.base == 'radix'
      - run: pnpm --filter shadcn-table tsc:base
        if: matrix.base == 'base'
      - run: pnpm --filter shadcn-table lint
      - run: pnpm --filter shadcn-table storybook:build
        if: matrix.base == 'radix'
      - run: pnpm --filter shadcn-table storybook:build:base
        if: matrix.base == 'base'

  test:
    name: 'test (${{ matrix.base }}: vitest browser mode)'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: [radix, base]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shadcn-table exec playwright install --with-deps chromium
      - run: pnpm test
        if: matrix.base == 'radix'
      - run: pnpm test:base
        if: matrix.base == 'base'

  docs:
    name: docs (types, next build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shadcn-table-docs types:check
      - run: pnpm --filter shadcn-table-docs lint
      - run: pnpm --filter shadcn-table-docs build

  registry:
    name: registry (validate, dry-run add)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shadcn-table exec shadcn registry validate "anindosarker/shadcn-table#${{ github.sha }}"
      - run: pnpm --filter shadcn-table-docs exec shadcn add "anindosarker/shadcn-table/shadcn-table#${{ github.sha }}" --dry-run
      - run: pnpm --filter shadcn-table-docs exec shadcn add "anindosarker/shadcn-table/example-basic#${{ github.sha }}" --dry-run

  install:
    name: install (${{ matrix.scenario }} vite app)
    if: github.event_name == 'push'
    needs: registry
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REF: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, existing]
    steps:
      # The repo is checked out into repo/ only for the dev registry (locale
      # step below); the consumer app lives in ${{ runner.temp }}/app so no
      # workspace file leaks into it.
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: repo/pnpm-lock.yaml
      - name: Scaffold a Vite app on the Radix base
        run: pnpm dlx shadcn@latest init --template vite --base radix --preset nova --name app --yes
        working-directory: ${{ runner.temp }}
      - name: Pre-install TanStack packages (existing app only)
        if: matrix.scenario == 'existing'
        run: pnpm add @tanstack/react-table@8.20.5 @tanstack/react-query
        working-directory: ${{ runner.temp }}/app
      - name: Add the library at this SHA
        run: |
          set -o pipefail
          pnpm dlx shadcn@latest add "anindosarker/shadcn-table/shadcn-table#$REF" --yes 2>&1 | tee shadcn-add.log
        working-directory: ${{ runner.temp }}/app
      - name: Mount a table, type-check and build
        run: |
          cat > src/App.tsx <<'TSX'
          import { ShadcnTable } from '@/components/ui/shadcn-table';

          const columns = [
            { accessorKey: 'name', header: 'Name' },
            { accessorKey: 'age', header: 'Age' },
          ];
          const data = [
            { name: 'Ada', age: 36 },
            { name: 'Linus', age: 54 },
          ];

          export default function App() {
            return <ShadcnTable columns={columns} data={data} />;
          }
          TSX
          pnpm exec tsc --noEmit -p tsconfig.app.json
          pnpm exec vite build
        working-directory: ${{ runner.temp }}/app
      # A locale item depends on the unpinned GitHub address of the library,
      # which the CLI resolves on the default branch, not at this SHA. The dev
      # registry built from the checkout pins that dependency to this SHA's
      # library, so the locale is installed through it.
      - name: Build and serve the dev registry from this checkout
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter shadcn-table registry:dev
          (pnpm exec serve packages/shadcn-table/.dev -l 5310 > serve.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://localhost:5310/r/shadcn-table-locale-de.json > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:5310/r/shadcn-table-locale-de.json > /dev/null
        working-directory: repo
      # Example items pin the library to gitConfig.branch, so this add re-fetches
      # the library from that branch; --overwrite lets it replace the files
      # without a prompt. The library at this SHA was proven by the steps above.
      - name: Add a locale and example-basic, mount them, type-check and build
        run: |
          set -o pipefail
          pnpm dlx shadcn@latest add http://localhost:5310/r/shadcn-table-locale-de.json --yes --overwrite 2>&1 | tee -a shadcn-add.log
          pnpm dlx shadcn@latest add "anindosarker/shadcn-table/example-basic#$REF" --yes --overwrite 2>&1 | tee -a shadcn-add.log
          cat > src/App.tsx <<'TSX'
          import Example from '@/components/examples/basic/basic';
          import { ShadcnTable } from '@/components/ui/shadcn-table';
          import { ST_Localization_DE } from '@/components/ui/shadcn-table/locales/de';

          const columns = [{ accessorKey: 'name', header: 'Name' }];
          const data = [{ name: 'Ada' }];

          export default function App() {
            return (
              <>
                <Example />
                <ShadcnTable columns={columns} data={data} localization={ST_Localization_DE} />
              </>
            );
          }
          TSX
          pnpm exec tsc --noEmit -p tsconfig.app.json
          pnpm exec vite build
        working-directory: ${{ runner.temp }}/app
      - name: One @tanstack/react-table entry in package.json
        run: |
          count=$(node -e 'const p=require("./package.json");const all={...p.dependencies,...p.devDependencies};console.log(Object.keys(all).filter(k=>k==="@tanstack/react-table").length)')
          node -e 'const p=require("./package.json");console.log("@tanstack/react-table", p.dependencies["@tanstack/react-table"])'
          test "$count" = "1"
        working-directory: ${{ runner.temp }}/app
      - name: Show package.json and shadcn output
        if: failure()
        run: |
          echo "::group::package.json"; cat package.json; echo "::endgroup::"
          echo "::group::shadcn output"; cat shadcn-add.log 2>/dev/null || true; echo "::endgroup::"
        working-directory: ${{ runner.temp }}/app
