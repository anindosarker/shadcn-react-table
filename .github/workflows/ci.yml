name: ci

on:
  push:
    branches: [master, claude/review]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: library (tsc, lint, storybook build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shadcn-table tsc
      - run: pnpm --filter shadcn-table lint
      - run: pnpm --filter shadcn-table storybook:build

  test:
    name: test (vitest browser mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shadcn-table exec playwright install --with-deps chromium
      - run: pnpm test

  docs:
    name: docs (types, next build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shadcn-table-docs types:check
      - run: pnpm --filter shadcn-table-docs build

  registry:
    name: registry (validate, dry-run add)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shadcn-table exec shadcn registry validate "anindosarker/shadcn-table#${{ github.sha }}"
      - run: pnpm --filter shadcn-table-docs exec shadcn add "anindosarker/shadcn-table/shadcn-table#${{ github.sha }}" --dry-run
      - run: pnpm --filter shadcn-table-docs exec shadcn add "anindosarker/shadcn-table/example-basic#${{ github.sha }}" --dry-run

  install:
    name: install (${{ matrix.scenario }} vite app)
    if: github.event_name == 'push'
    needs: registry
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REF: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, existing]
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The app lives outside the checkout (there is none) so nothing from the
      # repo, such as a workspace file, leaks into the consumer project.
      - name: Scaffold a Vite app on the Radix base
        run: pnpm dlx shadcn@latest init --template vite --base radix --preset nova --name app --yes
        working-directory: ${{ runner.temp }}
      - name: Pre-install TanStack packages (existing app only)
        if: matrix.scenario == 'existing'
        run: pnpm add @tanstack/react-table@8.20.5 @tanstack/react-query
        working-directory: ${{ runner.temp }}/app
      - name: Add the library and a locale at this SHA
        run: |
          set -o pipefail
          pnpm dlx shadcn@latest add "anindosarker/shadcn-table/shadcn-table#$REF" --yes 2>&1 | tee shadcn-add.log
          pnpm dlx shadcn@latest add "anindosarker/shadcn-table/shadcn-table-locale-de#$REF" --yes 2>&1 | tee -a shadcn-add.log
        working-directory: ${{ runner.temp }}/app
      - name: Mount a table, type-check and build
        run: |
          cat > src/App.tsx <<'TSX'
          import { ShadcnTable } from '@/components/ui/shadcn-table';
          import { ST_Localization_DE } from '@/components/ui/shadcn-table/locales/de';

          const columns = [
            { accessorKey: 'name', header: 'Name' },
            { accessorKey: 'age', header: 'Age' },
          ];
          const data = [
            { name: 'Ada', age: 36 },
            { name: 'Linus', age: 54 },
          ];

          export default function App() {
            return (
              <ShadcnTable columns={columns} data={data} localization={ST_Localization_DE} />
            );
          }
          TSX
          pnpm exec tsc --noEmit -p tsconfig.app.json
          pnpm exec vite build
        working-directory: ${{ runner.temp }}/app
      # Example items pin the library to gitConfig.branch, so this add re-fetches
      # the library from that branch; --overwrite lets it replace the files
      # without a prompt. The library at this SHA was proven by the step above.
      - name: Add example-basic, mount it, type-check and build
        run: |
          set -o pipefail
          pnpm dlx shadcn@latest add "anindosarker/shadcn-table/example-basic#$REF" --yes --overwrite 2>&1 | tee -a shadcn-add.log
          cat > src/App.tsx <<'TSX'
          import Example from '@/components/examples/basic/basic';

          export default function App() {
            return <Example />;
          }
          TSX
          pnpm exec tsc --noEmit -p tsconfig.app.json
          pnpm exec vite build
        working-directory: ${{ runner.temp }}/app
      - name: One @tanstack/react-table entry in package.json
        run: |
          count=$(node -e 'const p=require("./package.json");const all={...p.dependencies,...p.devDependencies};console.log(Object.keys(all).filter(k=>k==="@tanstack/react-table").length)')
          node -e 'const p=require("./package.json");console.log("@tanstack/react-table", p.dependencies["@tanstack/react-table"])'
          test "$count" = "1"
        working-directory: ${{ runner.temp }}/app
      - name: Show package.json and shadcn output
        if: failure()
        run: |
          echo "::group::package.json"; cat package.json; echo "::endgroup::"
          echo "::group::shadcn output"; cat shadcn-add.log 2>/dev/null || true; echo "::endgroup::"
        working-directory: ${{ runner.temp }}/app
